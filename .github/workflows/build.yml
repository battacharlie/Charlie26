name: Compila

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # Versione: dal tag vX.Y.Z, oppure su main dal file VERSION. Su main, se la
      # versione non è ancora pubblicata, la release viene creata in automatico.
      - name: Versione
        id: ver
        run: |
          RELEASE=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="$GITHUB_REF_NAME"; RELEASE=true
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            VERSION="v$(tr -d ' \r\n' < VERSION)"
            if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null; then
              VERSION="$VERSION-main-${GITHUB_SHA::7}"   # già pubblicata: compilazione di prova
            else
              RELEASE=true
            fi
          else
            VERSION="${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"
          fi
          if [ "$RELEASE" = true ]; then NUM="${VERSION#v}"; else NUM="0.0.0"; fi
          IFS=. read -r MA MI PA <<< "$NUM"
          CODE=$(( MA * 10000 + MI * 100 + PA ))
          [ "$RELEASE" = true ] || CODE=$GITHUB_RUN_NUMBER
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "num=$NUM" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "Versione $VERSION (numero $NUM, Android $CODE), release: $RELEASE"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race ./...
      - name: Compila Windows, macOS e Linux
        run: |
          mkdir -p dist
          VERSION="${{ steps.ver.outputs.version }}"
          NUM="${{ steps.ver.outputs.num }}"
          # Icona e informazioni di versione dell'eseguibile Windows.
          go run ./tools/winres -version "$NUM"
          for t in windows/amd64 darwin/arm64 darwin/amd64 linux/amd64; do
            os=${t%/*}; arch=${t#*/}; ext=""; gui=""
            # Windows: niente finestra nera, il programma vive come icona vicino all'orologio.
            [ "$os" = windows ] && ext=.exe && gui="-H=windowsgui"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w $gui -X main.version=$VERSION" \
              -o "dist/charlie26-$os-$arch$ext" .
          done
          rm -f rsrc_windows_amd64.syso
          ls -la dist
      # ---------- App Android (Capacitor) ----------
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Compila app Android
        # L'Android SDK è già installato sulle macchine di GitHub; i componenti
        # mancanti li scarica Gradle da solo.
        working-directory: mobile
        timeout-minutes: 20
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          C26_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # versionCode crescente: 1.2.3 → 10203 (le prove usano il numero di compilazione)
          NUM="${{ steps.ver.outputs.num }}"
          CODE="${{ steps.ver.outputs.code }}"
          npm ci --no-audit --no-fund
          npm run prepare-www
          npx cap sync android
          cd android
          if [ -n "$KEYSTORE_B64" ]; then
            # Firma stabile: gli aggiornamenti si installano sopra la versione precedente.
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/charlie26.keystore"
            export C26_KEYSTORE="$RUNNER_TEMP/charlie26.keystore"
            ./gradlew assembleRelease --no-daemon -Pc26Version="$NUM" -Pc26VersionCode="$CODE"
            cp app/build/outputs/apk/release/app-release.apk ../../dist/charlie26-android.apk
          else
            echo "::warning::Chiave di firma Android non configurata: APK di prova (per aggiornarlo va disinstallata la versione precedente)."
            ./gradlew assembleDebug --no-daemon -Pc26Version="$NUM" -Pc26VersionCode="$CODE"
            cp app/build/outputs/apk/debug/app-debug.apk ../../dist/charlie26-android.apk
          fi
          (cd ../../dist && sha256sum charlie26-* > SHA256SUMS.txt && ls -la)
      - uses: actions/upload-artifact@v4
        with:
          name: charlie26
          path: dist/
      - name: Pubblica release
        if: steps.ver.outputs.release == 'true' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: CHARLIE26 – Intercom Evoluto ${{ steps.ver.outputs.num }}
          files: dist/*
          body: |
            ## Scarica
            | File | Per |
            |---|---|
            | `charlie26-windows-amd64.exe` | Windows 10/11 |
            | `charlie26-darwin-arm64` | Mac con chip Apple (M1, M2, M3…) |
            | `charlie26-darwin-amd64` | Mac con processore Intel |
            | `charlie26-linux-amd64` | Server Linux su internet (VPS), vedi [guida](https://github.com/${{ github.repository }}/blob/main/deploy/server/README.md) |
            | `charlie26-android.apk` | App per telefoni Android (tecnici e regia da smartphone) |

            **Windows**: doppio clic. Se compare "Windows ha protetto il PC": *Ulteriori informazioni → Esegui comunque*. Al primo avvio consenti l'accesso alle **Reti private**. Il programma resta come icona vicino all'orologio.

            **Mac** (file non firmati da Apple), nel Terminale:
            ```
            chmod +x charlie26-darwin-arm64
            xattr -d com.apple.quarantine charlie26-darwin-arm64
            ./charlie26-darwin-arm64
            ```

            **Android**: apri `charlie26-android.apk` dal telefono e consenti "Installa app sconosciute" per il browser o per File.

            CHARLIE26 – Intercom Evoluto · Andrea Battaglioli – [www.andreabattaglioli.it](https://www.andreabattaglioli.it) · [MyWebTvLive.com](https://www.mywebtvlive.com) · Made in Bolognina

            Istruzioni complete e guida per l'evento nel [README](https://github.com/${{ github.repository }}#readme).
