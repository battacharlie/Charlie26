name: Compila

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race ./...
      - name: Compila Windows e macOS
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}-${GITHUB_SHA::7}"
          for t in windows/amd64 darwin/arm64 darwin/amd64; do
            os=${t%/*}; arch=${t#*/}; ext=""
            [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/intercom-$os-$arch$ext" .
          done
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: intercom
          path: dist/
      - name: Pubblica release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
