<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CHARLIE26 – QR da stampare</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/brand/favicon-32.png">
  <link rel="apple-touch-icon" href="/static/brand/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.json">
  <style>
    /* Pagina da stampare: bianco e nero, A4, schede da ritagliare. */
    @page { size: A4; margin: 10mm; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #111; background: #e9eaec; }
    .bar { position: sticky; top: 0; background: #111; color: #fff; padding: 10px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    .bar button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 0; background: #2f6fed; color: #fff; cursor: pointer; }
    .bar label { display: inline-flex; gap: 6px; align-items: center; }
    .sheet { width: 210mm; margin: 12px auto; background: #fff; padding: 10mm; }
    h1 { font-size: 18px; margin: 0 0 6mm; }
    .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6mm; }
    .head img { height: 16mm; }
    .head h1 { margin: 0; }
    .foot { margin-top: 6mm; font-size: 10px; color: #666; text-align: center; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4mm; }
    .card { border: 1px dashed #999; border-radius: 3mm; padding: 4mm; text-align: center; break-inside: avoid; }
    .card img { width: 46mm; height: 46mm; display: block; margin: 0 auto 2mm; }
    .card b { display: block; font-size: 16px; }
    .card .sub { font-size: 12px; color: #444; }
    .card .how { font-size: 10px; color: #666; margin-top: 2mm; }
    @media print {
      body { background: #fff; }
      .bar { display: none; }
      .sheet { width: auto; margin: 0; padding: 0; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <button onclick="window.print()">🖨 Stampa / Salva come PDF</button>
    <label><input type="checkbox" id="withHelp" checked> includi il QR di aiuto certificato</label>
    <span>Per il PDF scegli "Salva come PDF" come stampante.</span>
  </div>
  <div class="sheet">
    <div class="head"><img src="/static/brand/logo-charlie26.png" alt="CHARLIE26 – Intercom Evoluto"><h1 id="title"></h1></div>
    <div class="grid" id="grid"></div>
    <div class="foot">CHARLIE26 – Intercom Evoluto · Andrea Battaglioli – www.andreabattaglioli.it · <span class="mwtl"><img src="/static/brand/mwtl-logo.png" alt="" width="18" height="18">MyWebTvLive.com</span> · Made in Bolognina</div>
  </div>
  <script>
    (async () => {
      const [ev, info] = await Promise.all([
        fetch('/api/regia/evento').then((r) => r.json()),
        fetch('/api/info').then((r) => r.json()),
      ]);
      const cred = ev.mode === 'credenziali';
      document.getElementById('title').textContent = ev.name;
      const grid = document.getElementById('grid');
      const card = (src, title, sub, how, cls) => {
        const d = document.createElement('div');
        d.className = 'card ' + (cls || '');
        const img = document.createElement('img');
        img.src = src;
        const b = document.createElement('b');
        b.textContent = title;
        const s = document.createElement('div');
        s.className = 'sub';
        s.textContent = sub;
        const h = document.createElement('div');
        h.className = 'how';
        h.textContent = how;
        d.append(img, b, s, h);
        grid.appendChild(d);
      };
      const how = 'Inquadra con la fotocamera del telefono';
      card('/qr/app.png', 'CHARLIE26', cred ? 'accesso con utente e password' : 'scegli il tuo canale', how);
      if (cred) {
        for (const u of ev.users || []) {
          const chs = (u.channels || []).map((id) => (ev.channels.find((c) => c.id === id) || {}).name).filter(Boolean).join(', ');
          card('/qr/utente/' + encodeURIComponent(u.username) + '.png', u.name, (u.role === 'admin' ? 'Caporeparto' : 'Tecnico') + (chs ? ' · ' + chs : ''), 'Personale: entra senza password');
        }
      } else {
        for (const c of ev.channels) card('/qr/app.png?canale=' + encodeURIComponent(c.id), c.name, c.main ? 'canale principale' : 'reparto', how);
      }
      card('/qr/aiuto.png', 'Aiuto certificato', 'se il telefono dice "connessione non privata"', 'Inquadra prima questo', 'help');
      const help = document.getElementById('withHelp');
      help.addEventListener('change', () => document.querySelectorAll('.card.help').forEach((c) => { c.style.display = help.checked ? '' : 'none'; }));
      if (info.certMode !== 'locale') { help.checked = false; help.dispatchEvent(new Event('change')); }
    })();
  </script>
</body>
</html>
