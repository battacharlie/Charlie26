<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0d0f12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Intercom</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body data-role="tecnico">
  <div class="app" id="app">
    <!-- Schermata di ingresso -->
    <section class="join" id="joinView">
      <h1>Intercom di produzione</h1>
      <p class="muted">Scegli il tuo canale e premi Entra. Il browser ti chiederà il permesso di usare il microfono: rispondi <b>Consenti</b>.</p>
      <label class="field">Il tuo nome
        <input type="text" id="nameInput" placeholder="es. Marco – Cam 2" autocomplete="nickname" maxlength="24">
      </label>
      <label class="field">Canale
        <select id="channelInput"></select>
      </label>
      <div class="field" id="roleField">
        <span>Ruolo</span>
        <div class="seg">
          <label><input type="radio" name="role" value="tecnico" checked><span>Tecnico</span></label>
          <label><input type="radio" name="role" value="caporeparto"><span>Caporeparto</span></label>
        </div>
        <small class="muted" id="roleHint">Il caporeparto parla anche nel canale principale.</small>
      </div>
      <button class="btn" id="joinBtn">Entra</button>
      <div class="banner error hidden" id="joinError"></div>
    </section>

    <!-- Schermata intercom -->
    <section class="talk hidden" id="talkView">
      <div class="topbar">
        <span class="dot" id="connDot"></span>
        <span class="me" id="meLabel"></span>
        <span class="status" id="connText">connessione…</span>
      </div>
      <div class="banner hidden" id="talkBanner"></div>
      <div class="channels" id="channelList"></div>
      <details class="people">
        <summary>Collegati (<span id="peerCount">0</span>)</summary>
        <ul class="peers" id="peerList"></ul>
      </details>
      <div class="mic-area" id="bigMicArea"></div>
    </section>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
